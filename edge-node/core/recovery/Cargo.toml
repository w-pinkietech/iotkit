[package]
name = "iotkit-core-recovery"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
iotkit-core-storage = { path = "../storage" }
iotkit-core-ledger = { path = "../ledger" }
iotkit-core-timeseries = { path = "../timeseries" }
iotkit-core-registry = { path = "../registry" }
iotkit-core-publish = { path = "../publish" }
iotkit-core-ops = { path = "../ops" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
