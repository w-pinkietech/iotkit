[package]
name = "iotkit-edge-node"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "iotkit_edge_node"

[[bin]]
name = "iotkit-edge-node"
path = "src/main.rs"

[dependencies]
iotkit-core-types = { path = "../../core/types" }
iotkit-core-supervision = { path = "../../core/supervision" }
iotkit-core-engine = { path = "../../core/engine" }
iotkit-core-storage = { path = "../../core/storage" }
iotkit-core-timeseries = { path = "../../core/timeseries" }
iotkit-ingest-client = { path = "../../ingest/client", features = ["inproc"] }
iotkit-ingest-http = { path = "../../ingest/http" }
iotkit-input-adapter-host-api = { path = "../../input/host-api" }
iotkit-core-collector = { path = "../../core/collector" }
iotkit-core-ledger = { path = "../../core/ledger" }
iotkit-core-registry = { path = "../../core/registry" }
iotkit-core-publish = { path = "../../core/publish" }
iotkit-core-ops = { path = "../../core/ops" }
iotkit-core-recovery = { path = "../../core/recovery" }
bravepi-mainboard-adapter = { path = "../../adapters/bravepi-mainboard" }
rpi-local-adapter = { path = "../../adapters/rpi-local" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
thiserror = "2"
time = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
iotkit-core-storage = { path = "../../core/storage", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
