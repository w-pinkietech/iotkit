[package]
name = "iotkit-input-adapter-testkit"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
iotkit-core-registry = { path = "../../core/registry" }
iotkit-input-adapter-host-api = { path = "../host-api" }
