services:
  broker:
    image: "${IOTKIT_MOSQUITTO_IMAGE:?}"
    restart: unless-stopped
    user: "${IOTKIT_RUNTIME_UID:?}:${IOTKIT_RUNTIME_GID:?}"
    mem_limit: 268435456
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${IOTKIT_BROKER_BIND:?}:${IOTKIT_BROKER_PORT:?}:8883"
    volumes:
      - type: bind
        source: ${IOTKIT_MOSQUITTO_DIR:?}
        target: /mosquitto/config
        read_only: true
      - type: bind
        source: ${IOTKIT_BROKER_TLS_DIR:?}
        target: /mosquitto/config/tls
        read_only: true
      - type: bind
        source: ${IOTKIT_BROKER_DATA_DIR:?}
        target: /mosquitto/data

  edge:
    build:
      context: ..
      dockerfile: edge/Dockerfile
      target: runtime
    restart: unless-stopped
    user: "${IOTKIT_RUNTIME_UID:?}:${IOTKIT_RUNTIME_GID:?}"
    network_mode: host
    environment:
      IOTKIT_EXPECTED_STORAGE_PROFILE: ${IOTKIT_STORAGE_PROFILE:?}
      IOTKIT_STORAGE_PROFILE: ${IOTKIT_STORAGE_PROFILE:?}
      IOTKIT_POSTGRES_CONFIG: ${IOTKIT_POSTGRES_CONFIG:-}
      TMPDIR: /run/iotkit-tmp
    tmpfs:
      - /run/iotkit-tmp:mode=0700,uid=${IOTKIT_RUNTIME_UID:?},gid=${IOTKIT_RUNTIME_GID:?},noexec,nosuid,nodev
    depends_on:
      - broker
    command:
      - serve
      - --storage-profile
      - ${IOTKIT_STORAGE_PROFILE:?}
      - --db
      - /data/edge.db
      - --storage-metadata
      - /run/iotkit/storage-profile.json
      - --edge-id
      - ${IOTKIT_EDGE_ID:?}
      - --broker-url
      - ssl://${IOTKIT_BROKER_HOST:?}:${IOTKIT_BROKER_PORT:?}
      - --client-id
      - ${IOTKIT_EDGE_CLIENT_ID:?}
      - --username
      - ${IOTKIT_EDGE_USERNAME:?}
      - --password-file
      - /run/iotkit/edge-archive-mqtt-password
      - --trust-mode
      - bundle_only
      - --ca-file
      - /run/iotkit/broker-tls/ca.pem
      - --http-listen
      - 127.0.0.1:8080
      - --public-origin
      - ${IOTKIT_EDGE_ORIGIN:?}
      - --broker-certificate-file
      - /run/iotkit/broker-tls/server.pem
      - --storage-warning-percent
      - ${IOTKIT_EDGE_STORAGE_WARNING_PERCENT:-90}
      - --recovery-control-socket
      - /data/recovery-control.sock
      - --output-broker-url
      - ${IOTKIT_OUTPUT_BROKER_URL:?}
      - --output-client-id
      - ${IOTKIT_OUTPUT_CLIENT_ID:?}
      - --output-username
      - ${IOTKIT_OUTPUT_USERNAME:?}
      - --output-password-file
      - /run/iotkit/output-mqtt-password
      - --output-trust-mode
      - bundle_only
      - --output-ca-file
      - /run/iotkit/output-ca.pem
    volumes:
      - type: bind
        source: ${IOTKIT_EDGE_DATA_DIR:?}
        target: /data
      - type: bind
        source: ${IOTKIT_RECOVERY_DIR:?}
        target: /recovery
      - type: bind
        source: ${IOTKIT_STORAGE_METADATA_FILE:?}
        target: /run/iotkit/storage-profile.json
        read_only: true
      - type: bind
        source: ${IOTKIT_POSTGRES_CONFIG_FILE:?}
        target: /run/iotkit/postgres.json
        read_only: true
      - type: bind
        source: ${IOTKIT_EDGE_ARCHIVE_PASSWORD_FILE:?}
        target: /run/iotkit/edge-archive-mqtt-password
        read_only: true
      - type: bind
        source: ${IOTKIT_BROKER_TLS_DIR:?}
        target: /run/iotkit/broker-tls
        read_only: true
      - type: bind
        source: ${IOTKIT_OUTPUT_PASSWORD_FILE:?}
        target: /run/iotkit/output-mqtt-password
        read_only: true
      - type: bind
        source: ${IOTKIT_OUTPUT_CA_FILE:?}
        target: /run/iotkit/output-ca.pem
        read_only: true

  caddy:
    image: "caddy:2.10.2"
    restart: unless-stopped
    user: "${IOTKIT_RUNTIME_UID:?}:${IOTKIT_RUNTIME_GID:?}"
    network_mode: host
    environment:
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${IOTKIT_CADDY_CONFIG_FILE:?}
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${IOTKIT_BROKER_TLS_DIR:?}
        target: /etc/caddy/tls
        read_only: true
      - type: bind
        source: ${IOTKIT_CADDY_DATA_DIR:?}
        target: /data
      - type: bind
        source: ${IOTKIT_ACME_WEBROOT:?}
        target: /srv/acme
        read_only: true
