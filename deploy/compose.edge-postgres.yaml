services:
  postgres:
    image: "postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193"
    restart: unless-stopped
    mem_limit: 1073741824
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: iotkit
      POSTGRES_USER: iotkit
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    ports:
      - "127.0.0.1:${IOTKIT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username iotkit --dbname iotkit"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ${IOTKIT_POSTGRES_PASSWORD_FILE:?}
        target: /run/secrets/postgres-password
        read_only: true

  edge:
    build:
      target: runtime-postgres
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started

volumes:
  postgres-data:
