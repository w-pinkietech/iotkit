services:
  edge-node:
    build:
      context: ..
      dockerfile: edge/Dockerfile
      target: trial-runtime
    user: "${IOTKIT_SIGTERM_UID}:${IOTKIT_SIGTERM_GID}"
    network_mode: host
    # Docker sends SIGTERM before this grace expires. The runtime reserves five
    # seconds of this window for process teardown after its bounded cleanup.
    stop_grace_period: 15s
    entrypoint: ["/usr/local/bin/iotkit-edge-node"]
    command: ["--config", "/run/iotkit/edge.toml"]
    volumes:
      - type: bind
        source: ${IOTKIT_SIGTERM_STATE}/node
        target: /data
      - type: bind
        source: ${IOTKIT_SIGTERM_STATE}/edge.toml
        target: /run/iotkit/edge.toml
        read_only: true
      - type: bind
        source: ${IOTKIT_SIGTERM_STATE}/secrets/node-mqtt-password
        target: /run/secrets/node-mqtt-password
        read_only: true
