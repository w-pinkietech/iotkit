services:
  broker:
    image: "${IOTKIT_MOSQUITTO_IMAGE}"
    user: "${IOTKIT_TRIAL_UID}:${IOTKIT_TRIAL_GID}"
    entrypoint: ["mosquitto"]
    command: ["-c", "/mosquitto/config/mosquitto.conf"]
    restart: unless-stopped
    # Process presence is the portable readiness signal in the pinned Mosquitto
    # image (anonymous auth is disabled, so MQTT client probes require secrets).
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    ports:
      - "${IOTKIT_TRIAL_BROKER_BIND}:${IOTKIT_TRIAL_BROKER_PORT}:1883"
    volumes:
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/mosquitto/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/mosquitto/acl
        target: /mosquitto/config/acl
        read_only: true
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/mosquitto/passwords
        target: /mosquitto/config/passwords
        read_only: true

  edge-node:
    build:
      context: ..
      dockerfile: edge-node/Dockerfile
    user: "${IOTKIT_TRIAL_UID}:${IOTKIT_TRIAL_GID}"
    restart: unless-stopped
    # Cleanup is bounded to ten seconds; reserve the remaining five seconds
    # for runtime teardown before Docker sends SIGKILL. The graceful offline
    # status goes out inside this window.
    stop_grace_period: 15s
    network_mode: host
    depends_on:
      broker:
        condition: service_healthy
    command:
      - --config
      - /run/iotkit/iotkit.toml
    environment:
      # Explicit trial-only gate; the factory refuses trial-sample without this.
      IOTKIT_ENABLE_TRIAL_SAMPLE: "1"
    volumes:
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/node
        target: /data
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/node/iotkit.toml
        target: /run/iotkit/iotkit.toml
        read_only: true
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/node/pipelines-trial.toml
        target: /run/iotkit/pipelines-trial.toml
        read_only: true
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/secrets/node-mqtt-password
        target: /run/secrets/node-mqtt-password
        read_only: true
