services:
  broker:
    image: "${IOTKIT_MOSQUITTO_IMAGE}"
    user: "${IOTKIT_TRIAL_UID}:${IOTKIT_TRIAL_GID}"
    entrypoint: ["mosquitto"]
    command: ["-c", "/mosquitto/config/mosquitto.conf"]
    restart: unless-stopped
    ports:
      - "${IOTKIT_TRIAL_BROKER_BIND}:${IOTKIT_TRIAL_BROKER_PORT}:1883"
    volumes:
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/mosquitto/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/mosquitto/acl
        target: /mosquitto/config/acl
        read_only: true
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/mosquitto/passwords
        target: /mosquitto/config/passwords
        read_only: true

  edge:
    build:
      context: ..
      dockerfile: edge/Dockerfile
      target: trial-runtime
    user: "${IOTKIT_TRIAL_UID}:${IOTKIT_TRIAL_GID}"
    restart: unless-stopped
    network_mode: host
    depends_on:
      - broker
    entrypoint: ["/usr/local/bin/iotkit-edge"]
    command:
      - serve
      - --db
      - /data/edge.db
      - --edge-id
      - ${IOTKIT_TRIAL_EDGE_ID}
      - --broker-url
      - tcp://${IOTKIT_TRIAL_BROKER_BIND}:${IOTKIT_TRIAL_BROKER_PORT}
      - --client-id
      - iotkit-edge-trial
      - --username
      - edge
      - --password-file
      - /run/secrets/edge-mqtt-password
      - --allow-insecure
      - --http-listen
      - ${IOTKIT_TRIAL_CONSOLE_BIND}:${IOTKIT_TRIAL_CONSOLE_PORT}
      - --public-origin
      - http://${IOTKIT_TRIAL_CONSOLE_BIND}:${IOTKIT_TRIAL_CONSOLE_PORT}
      - --development-http
      - --deployment-profile
      - trial
    volumes:
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/edge
        target: /data
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/secrets/edge-mqtt-password
        target: /run/secrets/edge-mqtt-password
        read_only: true

  edge-node:
    build:
      context: ..
      dockerfile: edge/Dockerfile
      target: trial-runtime
    user: "${IOTKIT_TRIAL_UID}:${IOTKIT_TRIAL_GID}"
    restart: unless-stopped
    network_mode: host
    depends_on:
      - broker
    entrypoint: ["/usr/local/bin/iotkit-edge-node"]
    command:
      - --config
      - /run/iotkit/iotkit.toml
    environment:
      IOTKIT_EDGE_NODE_ID: ${IOTKIT_TRIAL_EDGE_NODE_ID}
    volumes:
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/node
        target: /data
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/node/iotkit.toml
        target: /run/iotkit/iotkit.toml
        read_only: true
      - type: bind
        source: ${IOTKIT_TRIAL_STATE}/secrets/node-mqtt-password
        target: /run/secrets/node-mqtt-password
        read_only: true
