services:
  broker:
    image: "${IOTKIT_MOSQUITTO_IMAGE:?}"
    restart: unless-stopped
    user: "${IOTKIT_RUNTIME_UID:?}:${IOTKIT_RUNTIME_GID:?}"
    mem_limit: 268435456
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${IOTKIT_BROKER_BIND:?}:${IOTKIT_BROKER_PORT:?}:8883"
    volumes:
      - type: bind
        source: ${IOTKIT_MOSQUITTO_DIR:?}
        target: /mosquitto/config
        read_only: true
      - type: bind
        source: ${IOTKIT_BROKER_TLS_DIR:?}
        target: /mosquitto/config/tls
        read_only: true
      - type: bind
        source: ${IOTKIT_BROKER_DATA_DIR:?}
        target: /mosquitto/data

  site:
    build:
      context: ../iotkit-site
    restart: unless-stopped
    user: "${IOTKIT_RUNTIME_UID:?}:${IOTKIT_RUNTIME_GID:?}"
    network_mode: host
    depends_on:
      - broker
    command:
      - serve
      - --db
      - /data/site.db
      - --broker-url
      - ssl://${IOTKIT_BROKER_HOST:?}:${IOTKIT_BROKER_PORT:?}
      - --client-id
      - iotkit-site
      - --username
      - site
      - --password-file
      - /run/iotkit/site-mqtt-password
      - --trust-mode
      - bundle_only
      - --ca-file
      - /run/iotkit/broker-tls/ca.pem
      - --http-listen
      - 127.0.0.1:8080
      - --public-origin
      - ${IOTKIT_SITE_ORIGIN:?}
      - --broker-certificate-file
      - /run/iotkit/broker-tls/server.pem
      - --output-broker-url
      - ${IOTKIT_OUTPUT_BROKER_URL:?}
      - --output-client-id
      - ${IOTKIT_OUTPUT_CLIENT_ID:?}
      - --output-username
      - ${IOTKIT_OUTPUT_USERNAME:?}
      - --output-password-file
      - /run/iotkit/output-mqtt-password
      - --output-trust-mode
      - bundle_only
      - --output-ca-file
      - /run/iotkit/output-ca.pem
    volumes:
      - type: bind
        source: ${IOTKIT_SITE_DATA_DIR:?}
        target: /data
      - type: bind
        source: ${IOTKIT_SITE_PASSWORD_FILE:?}
        target: /run/iotkit/site-mqtt-password
        read_only: true
      - type: bind
        source: ${IOTKIT_BROKER_TLS_DIR:?}
        target: /run/iotkit/broker-tls
        read_only: true
      - type: bind
        source: ${IOTKIT_OUTPUT_PASSWORD_FILE:?}
        target: /run/iotkit/output-mqtt-password
        read_only: true
      - type: bind
        source: ${IOTKIT_OUTPUT_CA_FILE:?}
        target: /run/iotkit/output-ca.pem
        read_only: true

  caddy:
    image: "caddy:2.10.2"
    restart: unless-stopped
    user: "${IOTKIT_RUNTIME_UID:?}:${IOTKIT_RUNTIME_GID:?}"
    network_mode: host
    environment:
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${IOTKIT_CADDY_CONFIG_FILE:?}
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${IOTKIT_BROKER_TLS_DIR:?}
        target: /etc/caddy/tls
        read_only: true
      - type: bind
        source: ${IOTKIT_CADDY_DATA_DIR:?}
        target: /data
      - type: bind
        source: ${IOTKIT_ACME_WEBROOT:?}
        target: /srv/acme
        read_only: true
