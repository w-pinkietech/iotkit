name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI: skip incremental and debuginfo. Speeds compile of the large workspace;
  # rust-cache already restores target artifacts across runs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Three lanes run on every PR; there is no changed-path selection. The journey
# lane is the end-to-end test (trial-sample Input Adapter -> IoTKit -> Broker ->
# independent consumer) and is the acceptance evidence of the redesign in #232.
# Policy: .agents/testing.md
jobs:
  lightweight:
    name: lightweight repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.4

      - name: Product release version consistency
        run: |
          node --test scripts/tests/release-version.test.mjs
          node scripts/check-release-version.mjs

      - name: Install product-docs tooling
        run: npm ci --prefix scripts/docs

      - name: Product documentation (IoTKit profile; OKF v0.2 packaging)
        env:
          OKF_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/tests/product-docs-frontmatter.test.mjs scripts/tests/product-docs-modes.test.mjs
          node scripts/check-product-docs.mjs --mode=all

      - name: Product documentation regression tests
        run: node --test scripts/tests/check-product-docs.test.mjs

      - name: MQTT Output Adapter v1 fixtures (schema and canonical form)
        run: node scripts/check-observation-fixtures.mjs

      - name: Trial profile configuration contract
        run: python3 -m unittest scripts.tests.test_iotkit_trial

      - name: Adapter author documentation API guard
        run: node --test scripts/tests/adapter-author-docs.test.mjs

      - name: Layer rules
        run: scripts/check-layers

      - name: Source/test layout
        run: scripts/check-source-layout

      - name: Battle-tested review catalog and routing
        run: |
          node scripts/battle-tested-review.mjs check
          node --test scripts/tests/battle-tested-review.test.mjs

      - name: Pure-refactoring evaluator foundation
        run: |
          node scripts/pure-refactoring-evaluator.mjs check
          node scripts/pure-refactoring-evaluator.mjs check --corpus-version 2
          node --test scripts/tests/pure-refactoring-evaluator.test.mjs
          # This validates checked-in report-only captures and their descriptive
          # comparison; it never applies a rollout threshold, posts a status,
          # or creates authority.
          node scripts/pure-refactoring-evaluator.mjs score --results review/pure-refactoring/evaluations/issue-212-v1-titlefree-gpt-5.6-sol-high.json
          node scripts/pure-refactoring-evaluator.mjs score --corpus-version 2 --results review/pure-refactoring/evaluations/issue-214-v2-historical-gpt-5.6-sol-high.json
          node scripts/pure-refactoring-evaluator.mjs compare --baseline-results review/pure-refactoring/evaluations/issue-212-v1-titlefree-gpt-5.6-sol-high.json --historical-results review/pure-refactoring/evaluations/issue-214-v2-historical-gpt-5.6-sol-high.json

      - name: Product-docs impact selector
        run: |
          node scripts/product-docs-impact.mjs check
          node --test scripts/tests/product-docs-impact.test.mjs

      - name: Product-docs freshness soft gate
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Soft only: the script always exits 0 and may emit ::warning::.
          node scripts/product-docs-impact.mjs soft-check \
            --base "${{ github.event.pull_request.base.sha }}" \
            --pr-body-env PR_BODY

      - name: Codex Cloud wrapper regression
        run: scripts/test-codex-cloud.sh

      - name: Local Rust concurrency defaults
        run: node --test scripts/tests/rust-concurrency.test.mjs

  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.4

      # serialport (via rpi4b-transport → adapters → iotkit-edge-node) pulls
      # libudev-sys, whose build script needs libudev's pkg-config file. It's
      # present on dev machines but not on a clean runner.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      # mise honors mise.toml (Rust 1.98.0 + rustfmt + clippy), so the
      # toolchain is pinned and reproducible with local dev.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Formatting (cargo fmt --check)
        run: cargo fmt --all --check

      - name: Lints (cargo clippy -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No separate full workspace build: nextest compiles what it needs.
      - name: Tests (nextest)
        run: cargo nextest run --workspace --profile ci

      # nextest does not run rustdoc tests; keep them as a cheap separate pass.
      - name: Doc tests
        run: cargo test --workspace --doc --no-fail-fast

  # Journey lane (一気通貫テスト): trial-sample Input Adapter -> iotkit-edge-node
  # -> Mosquitto -> independent consumer. L1 is the minimal loop, L2 injects
  # faults (Broker outage, kill -9, tuning change, deletion, storage failure,
  # graceful shutdown). Required since #232 child issue 4 and never removed.
  journey:
    name: journey (L1 minimal loop, L2 fault injection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev mosquitto mosquitto-clients
          # The package starts a system broker; the journey runs its own.
          sudo systemctl stop mosquitto || true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Contract fixtures at the subscriber (consumer conformance)
        run: scripts/test-observation-consumer.sh

      - name: End-to-end journey
        run: scripts/test-journey.sh

  # Stable required check for branch protection: every lane must succeed.
  required-ci:
    name: required CI
    if: ${{ always() }}
    needs: [lightweight, check, journey]
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane
        env:
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          JOURNEY_RESULT: ${{ needs.journey.result }}
        run: |
          set -euo pipefail
          for lane in lightweight check journey; do
            var="${lane^^}_RESULT"
            [[ "${!var}" == "success" ]] || {
              echo "$lane must succeed (was ${!var})" >&2
              exit 1
            }
          done
