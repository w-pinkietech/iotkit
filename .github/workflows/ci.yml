name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: IoTKit OKF documentation profile
        env:
          OKF_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-okf-docs.mjs

      # serialport (via rpi4b-transport → adapters → iotkit-edge-node) pulls
      # libudev-sys, whose build script needs libudev's pkg-config file. It's
      # present on dev machines but not on a clean runner.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      # rustup honors rust-toolchain.toml (channel 1.95.0 + rustfmt + clippy),
      # so the toolchain is pinned and reproducible with local dev.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Formatting (cargo fmt --check)
        run: cargo fmt --all --check

      - name: Layer rules (scripts/check-layers)
        run: scripts/check-layers

      - name: Source/test layout (scripts/check-source-layout)
        run: scripts/check-source-layout

      - name: Lints (cargo clippy -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

  edge:
    name: edge go / console test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: iotkit-edge/go.mod
          cache-dependency-path: iotkit-edge/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iotkit-edge/frontend/package-lock.json

      - name: Install Console tooling
        run: npm ci --prefix iotkit-edge/frontend

      - name: Console schema, types, and generated assets
        run: scripts/test-edge-console-frontend.sh

      - name: IoTKit Console browser journey
        run: scripts/test-edge-console-e2e.sh

      - name: Edge tests
        working-directory: iotkit-edge
        run: go test ./...
