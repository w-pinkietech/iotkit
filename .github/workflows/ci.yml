name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI: skip incremental and debuginfo. Speeds compile of the large workspace;
  # rust-cache already restores target artifacts across runs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: select CI jobs
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      console: ${{ steps.select.outputs.console }}
      edge: ${{ steps.select.outputs.edge }}
      trial: ${{ steps.select.outputs.trial }}
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" &&
                ! "$BASE_SHA" =~ ^0+$ &&
                -n "$HEAD_SHA" ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              node scripts/select-ci-jobs.mjs >> "$GITHUB_OUTPUT"
          else
            node scripts/select-ci-jobs.mjs </dev/null >> "$GITHUB_OUTPUT"
          fi

  lightweight:
    name: lightweight repository checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Product release version consistency
        run: |
          node --test scripts/tests/release-version.test.mjs
          node scripts/check-release-version.mjs

      - name: Install product-docs tooling
        run: npm ci --prefix scripts/docs

      - name: Product documentation (IoTKit profile; OKF v0.2 packaging)
        env:
          OKF_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/tests/product-docs-frontmatter.test.mjs scripts/tests/product-docs-modes.test.mjs
          node scripts/check-product-docs.mjs --mode=all

      - name: Product documentation regression tests
        run: node --test scripts/tests/check-product-docs.test.mjs

      - name: Trial profile configuration contract
        run: python3 -m unittest scripts.tests.test_iotkit_trial

      - name: Adapter author documentation API guard
        run: node --test scripts/tests/adapter-author-docs.test.mjs

      - name: Layer rules
        run: scripts/check-layers

      - name: Source/test layout
        run: scripts/check-source-layout

      - name: Battle-tested review catalog and routing
        run: |
          node scripts/battle-tested-review.mjs check
          node --test scripts/tests/battle-tested-review.test.mjs

      - name: Pure-refactoring evaluator foundation
        run: |
          node scripts/pure-refactoring-evaluator.mjs check
          node scripts/pure-refactoring-evaluator.mjs check --corpus-version 2
          node --test scripts/tests/pure-refactoring-evaluator.test.mjs
          # This validates checked-in report-only captures and their descriptive
          # comparison; it never applies a rollout threshold, posts a status,
          # or creates authority.
          node scripts/pure-refactoring-evaluator.mjs score --results review/pure-refactoring/evaluations/issue-212-v1-titlefree-gpt-5.6-sol-high.json
          node scripts/pure-refactoring-evaluator.mjs score --corpus-version 2 --results review/pure-refactoring/evaluations/issue-214-v2-historical-gpt-5.6-sol-high.json
          node scripts/pure-refactoring-evaluator.mjs compare --baseline-results review/pure-refactoring/evaluations/issue-212-v1-titlefree-gpt-5.6-sol-high.json --historical-results review/pure-refactoring/evaluations/issue-214-v2-historical-gpt-5.6-sol-high.json

      - name: Product-docs impact selector
        run: |
          node scripts/product-docs-impact.mjs check
          node --test scripts/tests/product-docs-impact.test.mjs

      - name: Product-docs freshness soft gate
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Soft only: the script always exits 0 and may emit ::warning::.
          # Hard fail for high-risk paths is a later issue, not this step.
          node scripts/product-docs-impact.mjs soft-check \
            --base "${{ github.event.pull_request.base.sha }}" \
            --pr-body-env PR_BODY

      - name: Selective CI routing
        run: node --test scripts/tests/select-ci-jobs.test.mjs

      - name: Verification ownership policy
        run: node --test scripts/tests/verification-policy.test.mjs

      - name: Codex Cloud wrapper regression
        run: scripts/test-codex-cloud.sh

      - name: Rust Edge release-gate contracts
        run: node --test scripts/tests/rust-edge-release-gates.test.mjs

      - name: Local Rust concurrency defaults
        run: node --test scripts/tests/rust-concurrency.test.mjs

  check:
    name: fmt / clippy / test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # serialport (via rpi4b-transport → adapters → iotkit-edge-node) pulls
      # libudev-sys, whose build script needs libudev's pkg-config file. It's
      # present on dev machines but not on a clean runner.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      # rustup honors rust-toolchain.toml (channel 1.95.0 + rustfmt + clippy),
      # so the toolchain is pinned and reproducible with local dev.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Formatting (cargo fmt --check)
        # Full tree; fmt is seconds, not the bottleneck.
        run: cargo fmt --all --check

      - name: Lints (cargo clippy -D warnings)
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail
          if [[ "$PACKAGES" == "all" || -z "$PACKAGES" ]]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            args=()
            IFS=',' read -ra pkgs <<< "$PACKAGES"
            for p in "${pkgs[@]}"; do
              args+=(-p "$p")
            done
            cargo clippy "${args[@]}" --all-targets -- -D warnings
          fi

      # No separate full workspace build: nextest compiles what it needs.
      # Path-focused package lists (not "all") skip the ~1300-test wall.
      - name: Tests (nextest)
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail
          if [[ "$PACKAGES" == "all" || -z "$PACKAGES" ]]; then
            cargo nextest run --workspace --profile ci
          else
            args=()
            IFS=',' read -ra pkgs <<< "$PACKAGES"
            for p in "${pkgs[@]}"; do
              args+=(-p "$p")
            done
            cargo nextest run "${args[@]}" --profile ci
          fi

      # nextest does not run rustdoc tests; keep them as a cheap separate pass.
      - name: Doc tests
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail
          if [[ "$PACKAGES" == "all" || -z "$PACKAGES" ]]; then
            cargo test --workspace --doc --no-fail-fast
          else
            args=()
            IFS=',' read -ra pkgs <<< "$PACKAGES"
            for p in "${pkgs[@]}"; do
              args+=(-p "$p")
            done
            cargo test "${args[@]}" --doc --no-fail-fast
          fi

  # Console UI lane: frontend check + browser e2e only (#166).
  # Custody/output live in the edge job so pure Console PRs stay shorter.
  console:
    name: Console frontend and browser journey
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/frontend/package-lock.json

      - name: Install Console tooling
        run: npm ci --prefix edge/frontend

      - name: Console schema, types, and generated assets
        run: scripts/test-edge-console-frontend.sh

      - name: IoTKit Console browser journey
        run: scripts/test-edge-console-e2e.sh

  edge:
    name: Edge custody and output integration
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unit/integration for iotkit-edge run in the rust job when rust=true.
      # This job is custody + durable output only (Console is the console job).

      - name: PostgreSQL, MQTT custody, and authentication
        run: scripts/test-rust-edge-custody.sh

      - name: Durable output delivery
        run: scripts/test-edge-output.sh

      - name: Edge Node SIGTERM shutdown
        run: scripts/test-edge-node-sigterm.sh

  trial:
    name: Trial profile first-run and custody journey
    needs: changes
    if: needs.changes.outputs.trial == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trial profile first-run and custody journey
        run: scripts/test-iotkit-trial.sh

  # Stable required check: a selected lane must succeed; an unselected optional
  # lane is skipped. `changes` fails closed to all lanes when diff metadata or
  # CI infrastructure is unsafe, so omitting a lane here is a policy failure.
  required-ci:
    name: required CI
    if: ${{ always() }}
    needs: [changes, lightweight, check, console, edge, trial]
    runs-on: ubuntu-latest
    steps:
      - name: Require mandatory and selected lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          EDGE_RESULT: ${{ needs.edge.result }}
          TRIAL_RESULT: ${{ needs.trial.result }}
          RUST_SELECTED: ${{ needs.changes.outputs.rust }}
          CONSOLE_SELECTED: ${{ needs.changes.outputs.console }}
          EDGE_SELECTED: ${{ needs.changes.outputs.edge }}
          TRIAL_SELECTED: ${{ needs.changes.outputs.trial }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]] || {
            echo "changes must succeed (was $CHANGES_RESULT)" >&2
            exit 1
          }
          [[ "$LIGHTWEIGHT_RESULT" == "success" ]] || {
            echo "lightweight must succeed (was $LIGHTWEIGHT_RESULT)" >&2
            exit 1
          }
          check_lane() {
            local name=$1 selected=$2 result=$3
            if [[ "$selected" == "true" ]]; then
              [[ "$result" == "success" ]] || {
                echo "$name was selected but did not succeed (was $result)" >&2
                exit 1
              }
            elif [[ "$selected" == "false" ]]; then
              [[ "$result" == "skipped" ]] || {
                echo "$name was not selected but did not skip (was $result)" >&2
                exit 1
              }
            else
              echo "$name has unsafe selector output: $selected" >&2
              exit 1
            fi
          }
          check_lane rust "$RUST_SELECTED" "$CHECK_RESULT"
          check_lane console "$CONSOLE_SELECTED" "$CONSOLE_RESULT"
          check_lane edge "$EDGE_SELECTED" "$EDGE_RESULT"
          check_lane trial "$TRIAL_SELECTED" "$TRIAL_RESULT"
