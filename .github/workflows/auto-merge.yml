name: Guarded auto-merge

# issue_comment workflows use the trusted default-branch workflow definition.
# This workflow never checks out or executes pull-request code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  arm:
    name: Arm authorized PR auto-merge
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.body == '/auto-merge' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    # Only an eligible command takes the PR lock. Other comments cannot cancel
    # the in-flight wait; synchronize still cancels it through the reset job.
    concurrency:
      group: guarded-auto-merge-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # Native auto-merge and its per-head approval status need these scopes.
    # This trusted workflow never checks out or executes pull-request code.
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Arm native squash auto-merge for an eligible pull request
        id: arm
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "invalid pull-request number" >&2
            exit 1
          }
          [[ "$COMMENT_AUTHOR" =~ ^[A-Za-z0-9-]{1,39}$ ]] || {
            echo "invalid comment author" >&2
            exit 1
          }

          if ! permission="$(gh api \
            "repos/$GITHUB_REPOSITORY/collaborators/$COMMENT_AUTHOR/permission" \
            --jq '.permission')"; then
            echo "could not establish $COMMENT_AUTHOR repository permission; not arming auto-merge"
            exit 0
          fi
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "$COMMENT_AUTHOR does not have effective write permission; not arming auto-merge"
              exit 0
              ;;
          esac

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          metadata="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,baseRefName,headRefOid)"
          state="$(jq -r '.state' <<<"$metadata")"
          draft="$(jq -r '.isDraft' <<<"$metadata")"
          base="$(jq -r '.baseRefName' <<<"$metadata")"
          head_ref_oid="$(jq -r '.headRefOid' <<<"$metadata")"
          if [[ "$state" != "OPEN" ||
                "$draft" != "false" ||
                "$base" != "$default_branch" ]]; then
            echo "PR is not open, ready, and targeted at the default branch; not arming auto-merge"
            exit 0
          fi
          [[ "$head_ref_oid" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid PR head oid" >&2
            exit 1
          }
          # Capture GitHub's recognized issue links before authorizing this PR.
          # Base64 keeps untrusted PR text out of the workflow output format.
          issue_refs="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences)"
          echo "approved_issue_refs=$(printf '%s' "$issue_refs" | base64 -w0)" >> "$GITHUB_OUTPUT"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$head_ref_oid" \
            -f state=success \
            -f description='Authorized /auto-merge comment' \
            -f context='human approval'

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
          echo 'armed=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.arm.outputs.armed == 'true'
        with:
          # issue_comment github.sha is the default-branch commit before merge.
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Wait for merge and delete the unchanged, unused head branch
        if: steps.arm.outputs.armed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          APPROVED_ISSUE_REFS: ${{ steps.arm.outputs.approved_issue_refs }}
        run: node scripts/cleanup-merged-head.mjs

  # pull_request_target runs this default-branch workflow definition. Do not
  # check out, fetch, or execute pull-request code in this trusted job.
  reset:
    name: Reset human approval after PR head changes
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    concurrency:
      group: guarded-auto-merge-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark event PR head pending before stale auto-merge disarm
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "invalid pull-request number" >&2
            exit 1
          }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid PR head sha" >&2
            exit 1
          }

          # Keep the required status pending even if the native disarm fails.
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state=pending \
            -f context='human approval'

          metadata="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest)"
          [[ "$(jq -r '.autoMergeRequest != null' <<<"$metadata")" == "true" ]] || {
            echo "auto-merge is not armed"
            exit 0
          }
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
