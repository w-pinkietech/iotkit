[package]
name = "iotkit-polling-adapter-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
iotkit-core-types = { path = "../core/types" }
iotkit-core-supervision = { path = "../core/supervision" }
iotkit-ingest-client = { path = "../iotkit-ingest-client", features = ["inproc"] }
iotkit-ingest-contract = { path = "../iotkit-ingest-contract" }
tokio = { version = "1", features = ["rt", "sync", "macros", "fs", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros", "fs", "rt-multi-thread", "time"] }
