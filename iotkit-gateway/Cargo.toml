[package]
name = "iotkit-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
iotkit-core-types = { path = "../core/types" }
iotkit-core-engine = { path = "../core/engine" }
iotkit-core-storage = { path = "../core/storage" }
iotkit-core-timeseries = { path = "../core/timeseries" }
iotkit-ingest-client = { path = "../iotkit-ingest-client", features = ["inproc"] }
iotkit-core-collector = { path = "../core/collector" }
iotkit-core-ledger = { path = "../core/ledger" }
iotkit-core-registry = { path = "../core/registry" }
iotkit-core-publish = { path = "../core/publish" }
iotkit-core-ops = { path = "../core/ops" }
bravepi-mainboard-adapter = { path = "../bravepi-mainboard-adapter" }
rpi-local-adapter = { path = "../rpi-local-adapter" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
thiserror = "2"
time = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
iotkit-core-storage = { path = "../core/storage", features = ["test-util"] }
