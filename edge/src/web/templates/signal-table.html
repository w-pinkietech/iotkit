<table id="signal-table">
  <thead><tr><th>センサー</th><th>現在値</th><th>受信状態</th><th>収集ノード</th></tr></thead>
  <tbody>
  {% for signal in view.signals %}
    <tr data-status="{{ signal.status_class }}">
      <td><a href="{% if is_admin && !signal.device_ref.is_empty() %}/equipment/devices/{{ signal.device_ref }}/sensors/{{ signal.signal_ref }}{% else %}/sensors/{{ signal.signal_ref }}{% endif %}"><strong>{{ signal.name }}</strong><small>{{ signal.sensor_type }}</small></a></td>
      <td>{{ signal.value }} {{ signal.unit }}</td>
      <td><span class="status-pill {{ signal.status_class }}">{{ signal.status_label }}</span></td>
      <td>{{ signal.edge_node_id }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
