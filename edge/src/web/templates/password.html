<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>パスワード変更 | IoTKit</title>
  <link rel="stylesheet" href="/static/edge.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1>パスワードを変更</h1>
    <form method="post" action="/password">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>現在のパスワード<input type="password" name="current_password" autocomplete="current-password" required></label>
      <label>新しいパスワード<input type="password" name="new_password" autocomplete="new-password" required></label>
      <button type="submit">パスワードを変更</button>
    </form>
  </main>
</body>
</html>
