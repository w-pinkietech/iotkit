[package]
name = "iotkit-edge"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "iotkit_edge"
path = "src/lib.rs"

[[bin]]
name = "iotkit-edge"
path = "src/main.rs"
