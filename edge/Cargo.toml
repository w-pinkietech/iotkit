[package]
name = "iotkit-edge"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
askama = "0.14"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "json", "macros"] }
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.4"
thiserror = "2"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_urlencoded = "0.7"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "migrate", "macros", "json", "uuid"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
iotkit-output-adapter-api = { path = "output-adapters/api" }
iotkit-output-adapter-generic-mqtt-json-v1 = { path = "output-adapters/generic-mqtt-json-v1" }
iotkit-output-adapter-pinikiet-mqtt-v1 = { path = "output-adapters/pinikiet-mqtt-v1" }
iotkit-edge-custody-contract = { path = "custody-contract" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "iotkit_edge"
path = "src/lib.rs"

[[bin]]
name = "iotkit-edge"
path = "src/main.rs"
