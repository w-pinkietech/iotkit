openapi: 3.1.0
info:
  title: IoTKit Console API
  version: 1.0.0
  description: >
    Browser-facing JSON contracts used by the server-rendered IoTKit Edge
    Console. HTML form endpoints are intentionally outside this schema.
servers:
  - url: /
paths:
  /api/v1/history:
    get:
      operationId: listHistory
      summary: Query a bounded page of durably stored sensor history
      security:
        - EdgeSession: []
      parameters:
        - $ref: "#/components/parameters/HistoryFrom"
        - $ref: "#/components/parameters/HistoryTo"
        - $ref: "#/components/parameters/HistorySignalRef"
        - $ref: "#/components/parameters/HistoryEdgeNodeID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A stable newest-first history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        default:
          $ref: "#/components/responses/RequestError"
  /api/v1/history/series:
    get:
      operationId: getHistorySeries
      summary: Aggregate one raw sensor or processed measurement rule into bounded time buckets
      security:
        - EdgeSession: []
      parameters:
        - $ref: "#/components/parameters/HistoryFrom"
        - $ref: "#/components/parameters/HistoryTo"
        - $ref: "#/components/parameters/HistorySignalRef"
        - name: rule_id
          in: query
          description: Active semantic rule to read instead of raw sensor values. Buckets honor the requested range; latest_* reports the latest persisted processed observation regardless of that range.
          schema:
            type: string
        - name: bucket_ms
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: At most 1000 chronological aggregate points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorySeries"
        default:
          $ref: "#/components/responses/RequestError"
  /api/v1/history.csv:
    get:
      operationId: exportHistoryCSV
      summary: Export the same bounded history filter as UTF-8 CSV
      security:
        - EdgeSession: []
      parameters:
        - $ref: "#/components/parameters/HistoryFrom"
        - $ref: "#/components/parameters/HistoryTo"
        - $ref: "#/components/parameters/HistorySignalRef"
        - $ref: "#/components/parameters/HistoryEdgeNodeID"
      responses:
        "200":
          description: CSV with a UTF-8 BOM for spreadsheet interoperability
          content:
            text/csv:
              schema:
                type: string
        "422":
          description: More than 100000 rows matched; narrow the filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/RequestError"
  /api/v1/semantic-history.csv:
    get:
      operationId: exportSemanticHistoryCSV
      summary: Export persisted processed semantic observations as UTF-8 CSV
      description: >
        Exports the results stored when IoTKit Edge applied calibration and semantic
        rules. Historical observations are not recomputed with current rules.
      security:
        - EdgeSession: []
      parameters:
        - $ref: "#/components/parameters/HistoryFrom"
        - $ref: "#/components/parameters/HistoryTo"
        - $ref: "#/components/parameters/HistorySignalRef"
        - $ref: "#/components/parameters/HistoryEdgeNodeID"
      responses:
        "200":
          description: Processed observation CSV with a UTF-8 BOM
          content:
            text/csv:
              schema:
                type: string
        "422":
          description: More than 100000 observations matched; narrow the filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/RequestError"
  /api/v1/system/storage:
    get:
      operationId: getStorageStatus
      summary: Read IoTKit Edge database, filesystem, and pending-work storage facts
      security:
        - EdgeSession: []
      responses:
        "200":
          description: Current storage facts observed by IoTKit Edge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        default:
          $ref: "#/components/responses/RequestError"
  /api/v1/system/diagnostics:
    get:
      operationId: getDiagnostics
      summary: Read factual IoTKit Edge, Edge Node, sensor, output, and restore diagnostics
      security:
        - EdgeSession: []
      responses:
        "200":
          description: Bounded diagnostic issues and explicit observability limitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticReport"
        default:
          $ref: "#/components/responses/RequestError"
  /api/v1/mapping-previews:
    post:
      operationId: createMappingPreview
      summary: Preview future-only semantic settings without writing them
      description: >
        Requires an authenticated IoTKit Console session, a matching
        X-CSRF-Token header, and a same-origin browser request.
      security:
        - EdgeSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingPreviewRequest"
      responses:
        "200":
          description: Preview built from the bounded recent input window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultipleRuleMappingPreview"
        "400":
          $ref: "#/components/responses/RequestError"
        "401":
          $ref: "#/components/responses/RequestError"
        "403":
          $ref: "#/components/responses/RequestError"
        "404":
          $ref: "#/components/responses/RequestError"
        default:
          $ref: "#/components/responses/RequestError"
components:
  securitySchemes:
    EdgeSession:
      type: apiKey
      in: cookie
      name: iotkit_edge_session
  parameters:
    HistoryFrom:
      name: from
      in: query
      required: true
      description: Inclusive IoTKit Edge receipt time in Unix milliseconds.
      schema:
        type: integer
        format: int64
        minimum: 0
    HistoryTo:
      name: to
      in: query
      required: true
      description: Exclusive IoTKit Edge receipt time in Unix milliseconds; ranges are limited to 31 days.
      schema:
        type: integer
        format: int64
        minimum: 1
    HistorySignalRef:
      name: signal_ref
      in: query
      description: Raw sensor selection when rule_id is absent. For /history/series, both buckets and latest_* are constrained to the requested range.
      schema:
        type: string
    HistorySignalRefRequired:
      name: signal_ref
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    HistoryEdgeNodeID:
      name: edge_node_id
      in: query
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Value of the same-origin iotkit_edge_csrf cookie.
      schema:
        type: string
        minLength: 1
  responses:
    RequestError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HistoryRecord:
      type: object
      additionalProperties: false
      required:
        - signal_ref
        - series_key
        - edge_node_id
        - ledger_epoch
        - pub_seq
        - received_at
        - observed_at
        - values
        - value_type
        - unit
        - display_name
        - decimal_places
        - display_value_kind
      properties:
        signal_ref: { type: string }
        series_key: { type: string }
        edge_node_id: { type: string }
        ledger_epoch: { type: string }
        pub_seq: { type: integer, format: int64 }
        received_at: { type: integer, format: int64 }
        observed_at: { type: integer, format: int64 }
        values:
          type: array
          items: { type: number }
        value_type: { type: string }
        unit: { type: string }
        display_name: { type: string }
        decimal_places: { type: integer }
        display_value_kind: { type: string }
    HistoryPage:
      type: object
      additionalProperties: false
      required: [records, has_more]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRecord"
        has_more: { type: boolean }
        next_cursor: { type: string }
    HistorySeriesPoint:
      type: object
      additionalProperties: false
      required: [bucket_start, minimum, average, maximum, sample_count]
      properties:
        bucket_start: { type: integer, format: int64 }
        minimum: { type: number }
        average: { type: number }
        maximum: { type: number }
        last_value:
          description: For rule_id series, the exact last persisted processed state in this bucket, ordered by observation persistence rather than by the aggregate average. Omitted for signal_ref series.
          type: number
        sample_count: { type: integer, format: int64 }
    HistorySeries:
      type: object
      additionalProperties: false
      required: [signal_ref, display_name, unit, value_type, sample_count, latest_received_at, latest_value, points]
      properties:
        signal_ref: { type: string }
        display_name: { type: string }
        unit: { type: string }
        value_type: { type: string }
        sample_count: { type: integer, format: int64 }
        latest_received_at:
          description: For signal_ref, exact IoTKit Edge receipt time of the latest raw record within the requested range. For rule_id, receipt time of the latest persisted processed observation regardless of the requested chart range. Null when the selected source has no value.
          type: [integer, "null"]
          format: int64
        latest_value:
          description: For signal_ref, the first raw value from that latest in-range record. For rule_id, the latest persisted processed value regardless of the requested chart range. Null when the selected source has no value.
          type: [number, boolean, string, "null"]
        points:
          type: array
          items:
            $ref: "#/components/schemas/HistorySeriesPoint"
    StorageStatus:
      type: object
      additionalProperties: false
      required:
        - profile
        - state
        - filesystem_available
        - database_bytes
        - reclaimable_bytes
        - disk_total_bytes
        - disk_available_bytes
        - disk_used_percent
        - warning_percent
        - raw_record_count
        - semantic_observation_count
        - pending_semantic_projection_count
        - pending_output_count
        - projection_failure_count
        - absolute_reserve_state
      properties:
        profile:
          type: string
          enum: [embedded, postgres]
        state:
          type: string
          enum: [healthy, warning, critical, unavailable]
        filesystem_available: { type: boolean }
        database_bytes: { type: integer, format: int64 }
        reclaimable_bytes: { type: integer, format: int64 }
        disk_total_bytes: { type: integer, format: int64, minimum: 0 }
        disk_available_bytes: { type: integer, format: int64, minimum: 0 }
        disk_used_percent: { type: integer, minimum: 0, maximum: 100 }
        warning_percent: { type: integer, minimum: 50, maximum: 99 }
        raw_record_count: { type: integer, format: int64, minimum: 0 }
        semantic_observation_count: { type: integer, format: int64, minimum: 0 }
        pending_semantic_projection_count:
          type: integer
          format: int64
          minimum: 0
          description: Durable rule-record work awaiting semantic projection, not raw-record or receipt lag.
        pending_output_count: { type: integer, format: int64, minimum: 0 }
        projection_failure_count: { type: integer, format: int64, minimum: 0 }
        last_backup_id: { type: string }
        last_backup_at: { type: integer, format: int64, minimum: 0 }
        absolute_reserve_state:
          type: string
          enum: [adequate, warning, critical, unknown]
    DiagnosticIssue:
      type: object
      additionalProperties: false
      required: [code, severity, component, summary, detail]
      properties:
        code: { type: string }
        severity:
          type: string
          enum: [info, warning, critical]
        component: { type: string }
        resource_ref: { type: string }
        summary: { type: string }
        detail: { type: string }
        observed_at: { type: integer, format: int64, minimum: 0 }
    DiagnosticReport:
      type: object
      additionalProperties: false
      required: [generated_at, state, issues, truncated, limitations, stages]
      properties:
        generated_at: { type: integer, format: int64, minimum: 0 }
        state:
          type: string
          enum: [healthy, attention, critical]
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticIssue"
        truncated: { type: boolean }
        limitations:
          type: array
          items: { type: string }
        stages:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticStage"
        broker_certificate:
          $ref: "#/components/schemas/CertificateStatus"
    DiagnosticStage:
      type: object
      additionalProperties: false
      required: [stage, state, code, affected_count, scope, cause, action, href]
      properties:
        stage:
          type: string
          enum: [sensor, adapter, node, broker, raw_custody, projection, external_output]
        state:
          type: string
          enum: [ok, warning, critical, unknown, not_applicable]
        code: { type: string }
        last_success_at: { type: integer, format: int64, minimum: 0 }
        affected_count: { type: integer, minimum: 0, maximum: 64 }
        scope: { type: string }
        cause: { type: string }
        action: { type: string }
        href: { type: string }
        blocked_by:
          type: string
          enum: [sensor, adapter, node, broker, raw_custody, projection, external_output]
    CertificateStatus:
      type: object
      additionalProperties: false
      required: [available, needs_action]
      properties:
        available: { type: boolean }
        not_after: { type: integer, format: int64 }
        days_remaining: { type: integer, format: int64 }
        needs_action: { type: boolean }
    SemanticKind:
      type: string
      enum: [numeric, boolean, cumulative_counter, alarm]
    DetectorMode:
      type: string
      enum: ["", boolean_high_active, boolean_low_active, high_active, low_active]
    TriggerMode:
      type: string
      enum: ["", on_transition, on_notification]
    Detector:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/DetectorMode"
        rise_threshold:
          type: number
        fall_threshold:
          type: number
        rise_debounce_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 300000
        fall_debounce_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 300000
    RuleSpec:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/SemanticKind"
        detector:
          $ref: "#/components/schemas/Detector"
        trigger:
          $ref: "#/components/schemas/TriggerMode"
    PreviewCalibration:
      type: object
      additionalProperties: false
      required: [scale, offset]
      properties:
        scale:
          type: number
        offset:
          type: number
    SemanticRulePreviewDraft:
      type: object
      additionalProperties: false
      required: [rule_id, display_name, spec]
      properties:
        rule_id:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        spec:
          $ref: "#/components/schemas/RuleSpec"
    MappingPreviewRequest:
      type: object
      additionalProperties: false
      required: [signal_ref, calibration, rules]
      properties:
        signal_ref:
          type: string
          minLength: 1
        test_value:
          type: number
        calibration:
          $ref: "#/components/schemas/PreviewCalibration"
        rules:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/SemanticRulePreviewDraft"
    PreviewPoint:
      type: object
      additionalProperties: false
      required:
        - received_at
        - plot_at
        - input
        - input_min
        - input_max
        - calibrated
        - calibrated_min
        - calibrated_max
        - active
        - counter
        - sample_count
        - active_samples
        - transitions
        - increment
      properties:
        received_at:
          type: integer
          format: int64
        plot_at:
          type: integer
          format: int64
        input:
          type: number
        input_min:
          type: number
        input_max:
          type: number
        calibrated:
          type: number
        calibrated_min:
          type: number
        calibrated_max:
          type: number
        active:
          oneOf:
            - type: boolean
            - type: "null"
        counter:
          oneOf:
            - type: integer
              format: int64
            - type: "null"
        sample_count:
          type: integer
        active_samples:
          type: integer
        transitions:
          type: integer
        increment:
          type: integer
          format: int64
    PreviewResult:
      type: object
      additionalProperties: false
      required: [emitted, number, boolean, integer, calibrated]
      properties:
        emitted:
          type: boolean
        number:
          oneOf:
            - type: number
            - type: "null"
        boolean:
          oneOf:
            - type: boolean
            - type: "null"
        integer:
          oneOf:
            - type: integer
              format: int64
            - type: "null"
        calibrated:
          type: number
    SemanticRulePreview:
      type: object
      additionalProperties: false
      required: [rule_id, display_name, kind, input_count, plot_count, points, latest_point, test_result, error]
      properties:
        rule_id:
          type: string
        display_name:
          type: string
        kind:
          $ref: "#/components/schemas/SemanticKind"
        input_count:
          type: integer
        plot_count:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/PreviewPoint"
        latest_point:
          oneOf:
            - $ref: "#/components/schemas/PreviewPoint"
            - type: "null"
        test_result:
          oneOf:
            - $ref: "#/components/schemas/PreviewResult"
            - type: "null"
        error:
          type: string
    MultipleRuleMappingPreview:
      type: object
      additionalProperties: false
      required: [calibration, rules, window_start, window_end]
      properties:
        calibration:
          $ref: "#/components/schemas/PreviewCalibration"
        rules:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SemanticRulePreview"
        window_start:
          oneOf:
            - type: integer
              format: int64
            - type: "null"
        window_end:
          oneOf:
            - type: integer
              format: int64
            - type: "null"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, field, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          oneOf:
            - type: string
            - type: "null"
        request_id:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
