[package]
name = "rpi-local-adapter"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[dependencies]
iotkit-core-types = { path = "../core/types" }
iotkit-input-adapter-host-api = { path = "../iotkit-input-adapter-host-api" }
iotkit-ingest-contract = { path = "../iotkit-ingest-contract" }
iotkit-polling-adapter-runtime = { path = "../iotkit-polling-adapter-runtime" }
rpi4b-transport = { path = "../rpi4b-transport" }
iotkit-sensor-drivers = { path = "../iotkit-sensor-drivers" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
