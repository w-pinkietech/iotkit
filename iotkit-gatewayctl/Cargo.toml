[package]
name = "iotkit-gatewayctl"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
iotkit-core-ledger = { path = "../core/ledger" }
iotkit-core-publish = { path = "../core/publish" }
iotkit-core-registry = { path = "../core/registry" }
iotkit-core-storage = { path = "../core/storage" }
iotkit-core-timeseries = { path = "../core/timeseries" }
iotkit-ingest-contract = { path = "../iotkit-ingest-contract" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
