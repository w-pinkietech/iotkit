# Project Codex defaults for the primary (Main) session.
# Custom subagents live as standalone files under .codex/agents/
# (see https://learn.chatgpt.com/docs/agent-configuration/subagents).
# How Main should dispatch roles (including Superpowers plan loops):
#   .codex/README.md

# No project-wide model or reasoning effort is pinned. Codex uses each
# contributor's session settings unless a task or personal subagent default
# selects another model.

[agents]
# Global multi-agent settings only. Role definitions are the standalone
# agent files in .codex/agents/ (implementer, complex_implementer, reviewer).
# A contributor may set [agents].default_subagent_model in personal Codex
# configuration to choose a model available in that contributor's plan.
# Do not collapse those roles into Main for multi-task Superpowers plans.
# max_concurrent_threads_per_session = 6
