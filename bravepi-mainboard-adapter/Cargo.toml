[package]
name = "bravepi-mainboard-adapter"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
iotkit-core-types = { path = "../core/types" }
iotkit-core-supervision = { path = "../core/supervision" }
rpi4b-transport = { path = "../rpi4b-transport" }
bravepi-codec = { path = "codec" }
iotkit-sensor-drivers = { path = "../iotkit-sensor-drivers" }
iotkit-ingest-client = { path = "../iotkit-ingest-client", features = ["inproc"] }
iotkit-ingest-contract = { path = "../iotkit-ingest-contract" }
iotkit-input-adapter-host-api = { path = "../iotkit-input-adapter-host-api" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
iotkit-ingest-client = { path = "../iotkit-ingest-client", features = ["test-util"] }
