# CI and local nextest defaults for the IoTKit workspace.
# serial_test / #[serial] continue to serialize tests that need it.
#
# Do not terminate slow tests by default: recovery/container suites can exceed
# several minutes under GHA contention (cargo test had no wall timeout).
# Log SLOW so outliers stay visible.

[profile.default]
# ubuntu-latest runners for public repositories have 4 vCPUs, and the local
# default (.cargo/config.toml RUST_TEST_THREADS) is also 4. Tests that spawn
# their own threads (tokio, FS, crypto) have been fine at this level locally.
test-threads = 4
slow-timeout = { period = "60s" }

[profile.ci]
test-threads = 4
slow-timeout = { period = "60s" }
fail-fast = false
