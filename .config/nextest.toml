# CI and local nextest defaults for the IoTKit workspace.
# serial_test / #[serial] continue to serialize tests that need it.

[profile.default]
# Use available CPUs; GHA free runners are typically 2–4 cores.
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
