# CI and local nextest defaults for the IoTKit workspace.
# serial_test / #[serial] continue to serialize tests that need it.
#
# Do not terminate slow tests by default: recovery/container suites can exceed
# several minutes under GHA contention (cargo test had no wall timeout).
# Log SLOW so outliers stay visible.

[profile.default]
# Free GHA runners are typically 2–4 cores; keep some headroom for tests that
# spawn their own threads (tokio, FS, crypto).
test-threads = 2
slow-timeout = { period = "60s" }

[profile.ci]
test-threads = 2
slow-timeout = { period = "60s" }
fail-fast = false
