{{define "password.html"}}
<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスワード変更 | IoTKit</title><link rel="stylesheet" href="/static/site.css"></head>
<body class="login-body"><main class="login-card"><div class="login-product"><img src="/static/pinkietech-mark.svg" alt=""><span><strong>IoTKit</strong><small>Site Console</small></span></div><h1>パスワードを変更</h1><p>初回ログインのため、自分だけが知っているパスワードへ変更してください。</p>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}<form method="post" action="/password"><input type="hidden" name="_csrf" value="{{.CSRF}}"><label>現在のパスワード<input type="password" name="current_password" autocomplete="current-password" required></label><label>新しいパスワード<input type="password" name="new_password" autocomplete="new-password" required></label><button>変更してログアウト</button></form></main></body></html>
{{end}}
