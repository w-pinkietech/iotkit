[package]
name = "iotkit-core-ops"
version = "0.1.0"
edition = "2024"

[dependencies]
iotkit-core-storage = { path = "../storage" }
iotkit-core-ledger = { path = "../ledger" }
iotkit-core-registry = { path = "../registry" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.5"
password-hash = { version = "0.5", default-features = false }
sha2 = "0.10"
getrandom = "0.4"
base64 = "0.22"
tracing = "0.1"
libc = "0.2"
subtle = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
iotkit-core-storage = { path = "../storage", features = ["test-util"] }
