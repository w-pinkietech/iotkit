[package]
name = "iotkit-edge-nodectl"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
iotkit-core-ledger = { path = "../core/ledger" }
iotkit-core-publish = { path = "../core/publish" }
iotkit-core-registry = { path = "../core/registry" }
iotkit-core-storage = { path = "../core/storage" }
iotkit-core-timeseries = { path = "../core/timeseries" }
iotkit-core-ops = { path = "../core/ops" }
iotkit-ingest-contract = { path = "../iotkit-ingest-contract" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2"
sha2 = "0.10"
time = "0.3"

[dev-dependencies]
tempfile = "3"
